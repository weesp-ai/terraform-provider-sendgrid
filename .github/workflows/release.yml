name: Release

# Pushing a tag like v0.2.0 builds, signs, and publishes a GitHub Release.
# The Terraform Registry ingests that release via webhook and serves the new
# provider version.
on:
  push:
    tags:
      - 'v*'

# Creating a GitHub Release and uploading assets counts as writing contents.
# The run's own token (id-token) is how it signs in to Google Cloud to read the
# signing key.
permissions:
  contents: write
  id-token: write

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  goreleaser:
    name: Build & Publish
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # GoReleaser needs full history and tags for the build.
          fetch-depth: 0
          # GoReleaser publishes via the GitHub API (GITHUB_TOKEN), not git
          # push, so we don't persist git credentials.
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # The signing key's private half is kept in Google Secret Manager, and the
      # run reads it as itself: Google Cloud accepts GitHub's token for a version
      # tag pushed in this repository, and nothing else.
      - name: Sign in to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/203210806173/locations/global/workloadIdentityPools/github-releases/providers/terraform-provider-sendgrid

      - name: Read the signing key
        uses: google-github-actions/get-secretmanager-secrets@v3
        id: secrets
        with:
          secrets: |-
            gpg_private_key:weesp-ai/terraform-provider-sendgrid-gpg-key

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        id: import_gpg
        with:
          gpg_private_key: ${{ steps.secrets.outputs.gpg_private_key }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
